<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Cyan to Emerald Gradient -->
    <linearGradient id="vz-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00E5A3"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Deep Tech Glow -->
    <filter id="vz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Obsidian Dark Background Squircle -->
  <rect width="128" height="128" rx="28" fill="#070A0F"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Glowing Underlayer -->
  <g filter="url(#vz-glow)" opacity="0.65">
    <path d="M22 28 L52 98 L72 28" stroke="url(#vz-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 28 L106 28 L60 98 L106 98" stroke="url(#vz-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Luminous Outer Contour -->
  <path d="M22 28 L52 98 L72 28" stroke="url(#vz-grad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 28 L106 28 L60 98 L106 98" stroke="url(#vz-grad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner Dark Obsidian Core Channel -->
  <path d="M22 28 L52 98 L72 28" stroke="#070A0F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 28 L106 28 L60 98 L106 98" stroke="#070A0F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Quantum Nexus Dot -->
  <circle cx="72" cy="28" r="3.5" fill="#FFFFFF"/>
</svg>
